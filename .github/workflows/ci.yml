name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hub
          POSTGRES_PASSWORD: hub
          POSTGRES_DB: hub_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # CI-only throwaway values; real secrets live in Vercel / GitHub secrets, never in git.
      DATABASE_URL: postgres://hub:hub@localhost:5432/hub_ci
      TEST_DATABASE_URL: postgres://hub:hub@localhost:5432/hub_ci
      NEXTAUTH_SECRET: ci-only-throwaway-secret-not-used-anywhere-else
      NEXTAUTH_URL: http://localhost:3100
      SEED_DEMO_PASSWORD: ci-demo-password-123
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint -- --max-warnings=0
      - name: Typecheck
        run: npm run typecheck
      - name: Migrate
        run: npm run db:migrate
      - name: Unit + integration tests (coverage)
        run: npm run test:coverage
      - name: npm audit (runtime dependencies)
        run: npm audit --omit=dev --audit-level=moderate
      - name: npm audit (all dependencies, high+)
        run: npm audit --audit-level=high
      - name: Build
        run: npm run build
      - name: Seed demo data
        run: npm run db:seed
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: E2E tests
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
